name: Deploy Gracespring Main

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Sync files & Restart PM2
        run: |
          rsync -avz --delete --exclude='.git' --exclude='node_modules' ./ /var/www/gracespring/
          cd /var/www/gracespring
          npm install --production
          pm2 restart "gracespring" || pm2 start npm --name "gracespring" -- run start -- -p 3001
          pm2 save


          
