name: Deploy NextJS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next App
        run: npm run build

      - name: Restart PM2
        run: |
          pm2 describe gsh > /dev/null \
            && pm2 restart gsh \
            || pm2 start npm --name "gsh" -- start
          pm2 save

          
      # - name: Restart PM2
      #   run: |
      #     pm2 delete gsh || true
      #     pm2 start npm --name "gsh" -- start
      #     pm2 save